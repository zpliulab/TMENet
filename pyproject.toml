[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tmenet"
version = "0.1.0"
description = "Joint inference of cell-type regulatory networks and spatial cell-cell coupling"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "TMENet authors"}]
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "scikit-learn>=1.3"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Scientific/Engineering :: Bio-Informatics"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
tmenet = "tmenet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

